{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce</title>

    <style>
      .home {
        background-image: url('{% static "core/homepage.jpg" %}');
        background-position: center;
        hight: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
      }
      .container {
        font-family: Arial, sans-serif;
        margin: 0 auto;
        padding: 20px;
        max-width: 1200px;
        align-items: center;
      }
      .footer {
        text-align: center;
        margin-top: 400px;
        border-bottom: 2px solid #141212ff;
      }
    </style>
  </head>
  <body class="home">
    <div class="container">
      <header>
        <nav>
          <h1>E-commerce Store</h1>
        </nav>
      </header>

      <main>
        <section>
          <h2>Welcome</h2>
          <p>Browse our products</p>
        </section>
      </main>

      <footer class="footer">
        <p>&copy; 2026 E-commerce Store. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
